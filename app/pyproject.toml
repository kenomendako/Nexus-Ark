[project]
name = "nexus-ark"
version = "0.2.0"
description = "Nexus Ark: AI Persona Interaction System"
authors = [{ name = "Kenomendako", email = "kenomendako@example.com" }]
readme = "README.md"
requires-python = ">=3.12.16, <3.13"
dependencies = [
    # --- Core Frameworks ---
    # Gradio 6.16.0 fixes the Svelte tab-switch update loop (upstream #13240).
    "gradio==6.16.0",
    "gradio_client",
    "langchain",
    "langchain-core",
    "langchain-google-genai==4.4.2",
    "langgraph",
    "google-genai==2.31.0",
    "google-api-core",
    # --- Google Calendar Integration (OAuth + Calendar API) ---
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    "pillow",
    # --- アトリエPWAのスマホ用QRコード生成（純Python・依存ゼロ） ---
    "segno",
    # --- RAG (Knowledge Base) Feature ---
    "faiss-cpu",
    "langchain-faiss",
    # langchain-community is often needed for various document loaders
    "langchain-community",
    # --- UI & Data Handling ---
    "pandas==2.3.2",
    "beautifulsoup4==4.13.5",
    "lxml==6.0.2",
    "pypdf==5.1.0",
    # --- Subprocess & Notifications ---
    "psutil==7.1.0",
    "plyer==2.1.0",
    "pywebpush>=2.0.3",
    "schedule==1.2.2",
    "requests==2.32.5",
    # eMudhra/emSign CA incident: keep the restored safe root bundle.
    "certifi==2026.10.23",
    # CVE-2026-111497: HTTP clients may automatically decode br responses.
    "brotli>=1.2.1; platform_python_implementation == 'CPython'",
    "brotlicffi>=1.2.1.0; platform_python_implementation != 'CPython'",
    # --- File & System Utilities ---
    "filetype==1.2.0",
    "filelock>=3.20.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "ijson==3.4.0",
    "ddgs==9.9.1",
    "concurrent-log-handler==0.9.28",
    "send2trash>=1.8.0",
    # --- LangChain/LangGraph Dependencies (Verified) ---
    "aiohttp==3.12.15",
    "anyio==4.11.0",
    "fastapi==0.133.0",
    "starlette==1.3.1",
    "httpx==0.28.1",
    "numpy==2.3.3",
    "matplotlib",
    "orjson==3.11.3",
    "pydantic==2.12.5",
    "PyYAML==6.0.2",
    "SQLAlchemy==2.0.43",
    "tenacity==9.1.2",
    # --- Audio dependency ---
    "pydub==0.25.1",
    # --- Markdown rendering ---
    "markdown-it-py~=3.0.0",
    "mdit-py-plugins~=0.4.0",
    # --- Multi-Provider Support ---
    "openai>=2.17.0",
    "langchain-openai",
    "langchain-tavily",
    # --- Topic Clustering Feature ---
    "hdbscan>=0.8.33",
    "sentence-transformers>=2.2.0",
    "python-chess",
    "playwright==1.64.1",
    "pytest-playwright>=0.7.2",
    "tufup>=0.10.0",
    "langchain-anthropic>=1.3.3",
    # --- Screenshot Feature ---
    "mss>=9.0.0",
    "tweepy>=4.16.0",
    "discord.py>=2.5.0",
    "discord-ext-voice-recv==0.5.2a179",
    "line-bot-sdk",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
win = [
    "pywin32==311 ; sys_platform == 'win32'"
]
local = [
    "llama-cpp-python"
]

[tool.uv]
managed = true
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: real API or network dependent tests that are excluded from the default suite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
